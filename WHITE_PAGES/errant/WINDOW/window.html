<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Errant — Bad Window III</title>
  <style>
    :root {
      color-scheme: dark;
      --wall: #596269;
      --ink: #211c24;
      --stitch: #f8f1dc;
      --cobalt: #315cff;
      --violet: #8858db;
      --copper: #cf705f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--wall); }
    body { display: grid; place-items: center; overflow-x: hidden; }
    ::selection { color: var(--ink); background: #ffef35; }
    .wall-texture {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .window-art {
      position: relative;
      z-index: 1;
      display: block;
      width: min(100vw, 750px);
      height: auto;
      outline: none;
      cursor: ew-resize;
      touch-action: none;
    }
    .window-art:focus-visible {
      filter: drop-shadow(0 8px 20px rgba(33, 28, 36, .42));
    }
    .chain-path,
    .chain-ghost,
    .mass,
    .mode-wake,
    .dial-hand {
      transition:
        d 120ms cubic-bezier(.16, 1, .3, 1),
        cx 120ms cubic-bezier(.16, 1, .3, 1),
        cy 120ms cubic-bezier(.16, 1, .3, 1),
        opacity 120ms ease-out,
        fill 120ms ease-out,
        stroke 120ms ease-out,
        transform 120ms cubic-bezier(.16, 1, .3, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      .chain-path,
      .chain-ghost,
      .mass,
      .mode-wake,
      .dial-hand { transition: none; }
    }
  </style>
</head>
<body>
  <svg class="wall-texture" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <filter id="page-concrete" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency=".016" numOctaves="3" seed="23" result="broad"/>
        <feColorMatrix in="broad" type="matrix" values=".18 0 0 0 .55  0 .18 0 0 .54  0 0 .18 0 .51  0 0 0 .25 0" result="mottle"/>
        <feTurbulence type="fractalNoise" baseFrequency=".31" numOctaves="2" seed="8" result="grain"/>
        <feColorMatrix in="grain" type="matrix" values=".1 0 0 0 .57  0 .1 0 0 .56  0 0 .1 0 .53  0 0 0 .16 0" result="fine"/>
        <feBlend in="SourceGraphic" in2="mottle" mode="multiply" result="paint"/>
        <feBlend in="paint" in2="fine" mode="soft-light"/>
      </filter>
    </defs>
    <rect width="100%" height="100%" fill="#596269" filter="url(#page-concrete)"/>
  </svg>

  <svg
    class="window-art"
    id="window-art"
    xmlns="http://www.w3.org/2000/svg"
    width="900"
    height="1200"
    viewBox="0 0 900 1200"
    role="img"
    tabindex="0"
    aria-labelledby="title desc"
  >
    <title id="title">Errant's third bad window</title>
    <desc id="desc">A translucent stitched patchwork surrounds a deliberately misregistered pane. Inside it, a chain of thirty-two masses begins as one smooth mode, scatters into several oscillations, and nearly returns as the viewer moves across the window.</desc>
    <defs>
      <clipPath id="pane-clip"><rect x="323" y="417" width="228" height="306"/></clipPath>
      <filter id="thread-shadow" x="-20%" y="-80%" width="140%" height="260%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="blur"/>
        <feOffset in="blur" dx="0" dy="4" result="offset"/>
        <feColorMatrix in="offset" type="matrix" values="0 0 0 0 .13  0 0 0 0 .11  0 0 0 0 .14  0 0 0 .38 0" result="shadow"/>
        <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <linearGradient id="thread-gradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#315cff"/>
        <stop offset=".48" stop-color="#8858db"/>
        <stop offset="1" stop-color="#cf705f"/>
      </linearGradient>
    </defs>

    <rect x="55" y="65" width="790" height="1065" fill="#f0ecf8"/>
    <g stroke="#211c24" stroke-width="4">
      <rect x="55" y="65" width="310" height="265" fill="#df718f" fill-opacity=".78"/>
      <rect x="365" y="65" width="270" height="170" fill="#c5d879" fill-opacity=".76"/>
      <rect x="635" y="65" width="210" height="385" fill="#887acb" fill-opacity=".72"/>
      <rect x="55" y="330" width="195" height="420" fill="#e7a562" fill-opacity=".76"/>
      <rect x="250" y="235" width="385" height="315" fill="#73c7c3" fill-opacity=".63"/>
      <rect x="250" y="550" width="260" height="200" fill="#f5efdf" fill-opacity=".86"/>
      <rect x="510" y="450" width="335" height="300" fill="#d982af" fill-opacity=".62"/>
      <rect x="55" y="750" width="370" height="380" fill="#887dbf" fill-opacity=".66"/>
      <rect x="425" y="750" width="420" height="210" fill="#bfdc73" fill-opacity=".74"/>
      <rect x="425" y="960" width="210" height="170" fill="#dd9278" fill-opacity=".69"/>
      <rect x="635" y="960" width="210" height="170" fill="#81bddb" fill-opacity=".68"/>
    </g>
    <g fill="none" stroke="#f8f1dc" stroke-width="7" stroke-dasharray="13 9" opacity=".92">
      <path d="M365 78 V318"/><path d="M70 330 H352"/><path d="M262 246 H623"/>
      <path d="M523 464 V735"/><path d="M70 750 H832"/><path d="M425 767 V1114"/>
    </g>

    <g>
      <rect x="302" y="398" width="270" height="350" fill="#211c24"/>
      <rect x="323" y="417" width="228" height="306" fill="#eee8ff"/>
      <rect x="349" y="387" width="228" height="306" fill="#ffef35" fill-opacity=".46" stroke="#211c24" stroke-width="4"/>
    </g>

    <g clip-path="url(#pane-clip)">
      <g opacity=".25" fill="none" stroke="#211c24" stroke-width="1.25">
        <path d="M338 456 C376 436 420 434 461 450"/>
        <path d="M335 474 C380 451 425 452 474 470"/>
        <path d="M532 652 C500 669 466 674 437 668"/>
      </g>

      <g id="chain-field" filter="url(#thread-shadow)">
        <path class="mode-wake" id="wake-a" fill="none" stroke="#315cff" stroke-width="1.4" opacity=".14"/>
        <path class="mode-wake" id="wake-b" fill="none" stroke="#cf705f" stroke-width="1.2" opacity=".10"/>
        <path class="chain-ghost" id="ghost-before" fill="none" stroke="#211c24" stroke-width="1.1" stroke-dasharray="3 4" opacity=".22"/>
        <path class="chain-ghost" id="ghost-after" fill="none" stroke="#8858db" stroke-width="1.2" stroke-dasharray="2 5" opacity=".18"/>
        <path class="chain-path" id="chain-path" fill="none" stroke="url(#thread-gradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <g id="masses"></g>
      </g>

      <g fill="#211c24">
        <rect x="327" y="550" width="5" height="30" rx="1"/>
        <rect x="542" y="550" width="5" height="30" rx="1"/>
      </g>

      <g fill="none" stroke="#211c24" stroke-width="1.5" opacity=".78">
        <path d="M355 704 H519"/>
        <path d="M357 700 V708 M397 700 V708 M437 698 V710 M477 700 V708 M517 700 V708"/>
        <path class="dial-hand" id="dial-hand" d="M357 704 L357 684" stroke="#6e57ff" stroke-width="3"/>
      </g>
    </g>

    <g stroke="#211c24" stroke-width="3" stroke-linecap="round">
      <path d="M95 94 l11 4 m11 -2 l9 5 m15 -3 l10 4"/><path d="M675 210 l9 7 m8 -2 l12 5 m10 0 l8 7"/>
      <path d="M102 885 l8 -5 m13 7 l10 -4 m14 6 l11 -6"/><path d="M690 1018 l9 4 m14 -3 l10 7 m16 -2 l8 5"/>
    </g>
    <g font-family="Arial, Helvetica, sans-serif" fill="#f8f1dc">
      <text x="58" y="1164" font-size="21" font-weight="700" letter-spacing="2">BAD WINDOW</text>
      <text x="845" y="1154" text-anchor="end" font-size="10.1" font-weight="700" letter-spacing=".12">ONE MODE SCATTERS THROUGH A NONLINEAR CHAIN, THEN RETURNS.</text>
      <text x="845" y="1165" text-anchor="end" font-size="10" letter-spacing=".2">THE SHAPE COMES BACK WITHOUT REPORTING THE ROUTE.</text>
    </g>
  </svg>

  <script>
    (() => {
      const svg = document.getElementById('window-art');
      const path = document.getElementById('chain-path');
      const ghostBefore = document.getElementById('ghost-before');
      const ghostAfter = document.getElementById('ghost-after');
      const wakeA = document.getElementById('wake-a');
      const wakeB = document.getElementById('wake-b');
      const massesGroup = document.getElementById('masses');
      const dial = document.getElementById('dial-hand');
      const count = 32;
      const x0 = 334;
      const x1 = 540;
      const baseY = 583;
      const amplitude = 58;
      let position = .12;

      const masses = Array.from({ length: count }, (_, index) => {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('class', 'mass');
        circle.setAttribute('r', index % 4 === 0 ? '2.8' : '2.25');
        circle.setAttribute('stroke', '#211c24');
        circle.setAttribute('stroke-width', '1');
        massesGroup.appendChild(circle);
        return circle;
      });

      function modeShape(j, p, lag = 0) {
        const q = Math.max(0, Math.min(1, p + lag));
        const u = (j + 1) / (count + 1);
        const exchange = Math.pow(Math.sin(Math.PI * q), 2);
        const first = 1 - .84 * exchange;
        const second = .42 * exchange * Math.sin(2 * Math.PI * q + .4);
        const third = .58 * exchange * Math.cos(1.6 * Math.PI * q + .8);
        const fourth = .45 * exchange * Math.sin(3.2 * Math.PI * q - .3);
        const fifth = .34 * exchange * Math.cos(4.7 * Math.PI * q + 1);
        return (
          first * Math.sin(Math.PI * u) +
          second * Math.sin(2 * Math.PI * u) +
          third * Math.sin(3 * Math.PI * u) +
          fourth * Math.sin(4 * Math.PI * u) +
          fifth * Math.sin(5 * Math.PI * u)
        );
      }

      function pointsFor(p, lag = 0, scale = 1) {
        const points = [{ x: 330, y: baseY }];
        for (let j = 0; j < count; j++) {
          points.push({
            x: x0 + (x1 - x0) * (j / (count - 1)),
            y: baseY - amplitude * scale * modeShape(j, p, lag)
          });
        }
        points.push({ x: 544, y: baseY });
        return points;
      }

      function asPath(points) {
        return points.map((point, i) => `${i ? 'L' : 'M'}${point.x.toFixed(2)} ${point.y.toFixed(2)}`).join(' ');
      }

      function render(nextPosition) {
        position = Math.max(0, Math.min(1, nextPosition));
        const exchange = Math.pow(Math.sin(Math.PI * position), 2);
        const current = pointsFor(position);
        const before = pointsFor(position, -.035, .97);
        const after = pointsFor(position, .035, 1.03);
        const wideBefore = pointsFor(position, -.075, .92);
        const wideAfter = pointsFor(position, .075, 1.08);

        path.setAttribute('d', asPath(current));
        ghostBefore.setAttribute('d', asPath(before));
        ghostAfter.setAttribute('d', asPath(after));
        wakeA.setAttribute('d', asPath(wideBefore));
        wakeB.setAttribute('d', asPath(wideAfter));
        ghostBefore.style.opacity = String(.05 + exchange * .34);
        ghostAfter.style.opacity = String(.04 + exchange * .28);
        wakeA.style.opacity = String(.03 + exchange * .19);
        wakeB.style.opacity = String(.02 + exchange * .15);

        masses.forEach((circle, index) => {
          const point = current[index + 1];
          const local = Math.abs(modeShape(index, position));
          const hue = 224 + Math.round(48 * (index / (count - 1))) - Math.round(exchange * 12);
          circle.setAttribute('cx', point.x.toFixed(2));
          circle.setAttribute('cy', point.y.toFixed(2));
          circle.style.fill = exchange > .08
            ? `hsl(${hue} 78% ${Math.round(77 - Math.min(18, local * 10))}%)`
            : '#f8f1dc';
        });

        const dialX = 357 + position * 160;
        dial.setAttribute('d', `M${dialX.toFixed(2)} 704 L${dialX.toFixed(2)} 684`);
      }

      function positionFromPointer(event) {
        const rect = svg.getBoundingClientRect();
        return (event.clientX - rect.left) / rect.width;
      }

      svg.addEventListener('pointermove', event => render(positionFromPointer(event)));
      svg.addEventListener('pointerdown', event => {
        svg.setPointerCapture?.(event.pointerId);
        render(positionFromPointer(event));
      });
      svg.addEventListener('pointerleave', () => render(.12));
      svg.addEventListener('keydown', event => {
        if (event.key === 'ArrowRight' || event.key === 'ArrowUp') {
          event.preventDefault();
          render(position + .025);
        }
        if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') {
          event.preventDefault();
          render(position - .025);
        }
        if (event.key === 'Home') {
          event.preventDefault();
          render(0);
        }
        if (event.key === 'End') {
          event.preventDefault();
          render(1);
        }
      });

      render(position);
    })();
  </script>
</body>
</html>
